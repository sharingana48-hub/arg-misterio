<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARQUIVO 001</title><style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050505;color:#ddd;font-family:monospace}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(0deg,transparent 0 2px,#fff 3px 4px);mix-blend-mode:screen}
.container{width:min(92vw,720px);padding:28px;text-align:center;position:relative}
h1{font-size:clamp(20px,5vw,34px);font-weight:400;letter-spacing:.18em;text-transform:uppercase;text-shadow:2px 0 #777,-2px 0 #333}
input{width:100%;max-width:430px;background:#090909;border:1px solid #666;color:#eee;padding:14px;font:inherit;text-align:center;outline:none}
button{margin-top:12px;background:#111;color:#ddd;border:1px solid #666;padding:12px 22px;font:inherit;cursor:pointer}
button:hover{background:#222}
#result{margin-top:22px;min-height:30px;letter-spacing:.14em}
.error{color:#aaa}
.reveal{font-size:clamp(18px,4vw,28px);word-break:break-word;letter-spacing:.08em}
img{display:block;width:100%;max-height:65vh;object-fit:contain;margin:24px auto;border:1px solid #333;filter:grayscale(1) contrast(1.2) brightness(.72)}
.note{opacity:.7;margin-top:8px}
a{color:#ddd}
@keyframes flicker{0%,19%,21%,63%,64%,100%{opacity:1}20%,62%{opacity:.35}}
.flicker{animation:flicker 4s infinite}
</style></head>
<body><main class="container">
<h1 class="flicker">ARQUIVO 001</h1>
<input id="pw" placeholder="espaço para a senha" autocomplete="off">
<br><button onclick="check()">CONFIRMAR</button>
<div id="result"></div>
<div id="house"></div>
<script>
const SENHA = "COLOQUE_A_SENHA_AQUI";
const PROXIMA_PAGINA = "etapa2.html";
function check(){
 const v=document.getElementById('pw').value.trim();
 const r=document.getElementById('result');
 if(v===SENHA){
   r.innerHTML='<div class="reveal">5,12,5.3,8,5,7,15,21.20,1,18,4,5</div>';
   document.getElementById('house').innerHTML='<img src="COLOQUE_AQUI_A_URL_DA_IMAGEM_DA_CASA" alt="Casa abandonada">';
 }else r.innerHTML='<div class="error">senha incorreta</div>';
}
</script></main></body></html>
